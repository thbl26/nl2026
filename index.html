function renderMatches(){const g=groupSelect.value,d=+daySelect.value,data=load(),ms=allFixtures().filter(x=>x.g===g&&x.d===d);const box=document.getElementById('matches');if(!ms.length){box.innerHTML='<div style="margin:24px;color:#64748b">An diesem Spieltag hat diese Gruppe keine Partie.</div>';return}box.innerHTML=ms.map((m,i)=>{const r=data[key(m)]||['',''];return `<div class="match"><div class="team home">${m.h}</div><img class="flag" id="fh${i}"><input inputmode="numeric" type="number" min="0" max="99" value="${r[0]}" data-k="${key(m)}" data-side="0"><span class="score-separator">:</span><input inputmode="numeric" type="number" min="0" max="99" value="${r[1]}" data-k="${key(m)}" data-side="1"><img class="flag" id="fa${i}"><div class="team away">${m.a}</div></div>`}).join('');ms.forEach((m,i)=>{setImg(document.getElementById('fh'+i),m.h);setImg(document.getElementById('fa'+i),m.a)});box.querySelectorAll('input').forEach(inp=>inp.addEventListener('input',()=>{const all=load(),k=inp.dataset.k,r=all[k]||['',''];r[+inp.dataset.side]=inp.value;all[k]=r;save(all);renderTable()}))}
function renderTable(){const g=groupSelect.value,data=load(),t={};groups[g].forEach(n=>t[n]={p:0,pts:0,gf:0,ga:0});allFixtures().filter(x=>x.g===g).forEach(m=>{const r=data[key(m)];if(!r||r[0]===''||r[1]==='')return;const a=+r[0],b=+r[1];if(!Number.isFinite(a)||!Number.isFinite(b)||a<0||b<0)return;t[m.h].p++;t[m.a].p++;t[m.h].gf+=a;t[m.h].ga+=b;t[m.a].gf+=b;t[m.a].ga+=a;if(a>b)t[m.h].pts+=3;else if(b>a)t[m.a].pts+=3;else{t[m.h].pts++;t[m.a].pts++}});const s=Object.entries(t).sort((a,b)=>b[1].pts-a[1].pts||((b[1].gf-b[1].ga)-(a[1].gf-a[1].ga))||b[1].gf-a[1].gf||a[0].localeCompare(b[0],'de'));document.getElementById('table').innerHTML=s.map(([n,v],i)=>{const diff=v.gf-v.ga;let cls='';if(g[0]==='A'){if(i<2)cls='qualify';else if(i===2)cls='playoff';else cls='relegation'}else if(g[0]==='B'){if(i===0)cls='promotion';else if(i===1)cls='playoff';else if(i===2)cls='playoff';else cls='relegation'}else if(g[0]==='C'){if(i===0)cls='promotion';else if(i===1)cls='playoff';else if(i===3)cls='relegation'}else{if(i===0)cls='promotion';else if(i===1)cls='playoff'}return `<tr class="${cls}"><td>${i+1}</td><td class="team-cell"><img id="tf${i}">${n}</td><td>${v.p}</td><td><strong>${v.pts}</strong></td><td>${v.gf}:${v.ga}</td><td>${diff>0?'+':''}${diff}</td></tr>`}).join('');s.forEach(([n],i)=>setImg(document.getElementById('tf'+i),n))}
function renderLegend(){const l=groupSelect.value[0];const x={A:'🔵 Platz 1–2: Viertelfinale · 🟡 Platz 3: Play-off · 🔴 Platz 4: Abstieg',B:'🟢 Platz 1: Aufstieg · 🟡 Platz 2/3: Play-offs · 🔴 Platz 4: Abstieg',C:'🟢 Platz 1: Aufstieg · 🟡 Platz 2: Play-off · 🔴 Platz 4: abhängig vom Vergleich der Gruppen',D:'🟢 Platz 1: Aufstieg · 🟡 Platz 2: Play-off'};document.getElementById('legend').textContent=x[l]}
function resetGroup(){const g=groupSelect.value;if(!confirm(`Alle eingetragenen Ergebnisse der Gruppe ${g} löschen?`))return;const data=load();allFixtures().filter(x=>x.g===g).forEach(m=>delete data[key(m)]);save(data);render()}
render();
</script>
</body></html>
