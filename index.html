<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UEFA Nations League Manager 2026/27</title>
<style>
*{box-sizing:border-box}
:root{--nl-navy:#071c34;--nl-blue:#0a3d73;--nl-cyan:#00a8e8;--nl-lime:#b9e800;--nl-red:#df3348}
body{font-family:Arial,Helvetica,sans-serif;background:#f3f4f8;text-align:center;margin:0;color:#19131f}
h1{background:linear-gradient(135deg,var(--nl-navy),#0a3d73 62%,#06111f);color:white;padding:16px 12px;margin:0;font-size:clamp(24px,5vw,34px);display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;border-bottom:4px solid var(--nl-lime)}
.league-logo{width:86px;height:86px;object-fit:contain;background:white;border-radius:14px;padding:3px}
.subtitle{margin:12px 0 18px;color:#5f6670}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.controls label{font-weight:bold} select,input{border:1px solid #ccd4dd;border-radius:7px;background:white}
.controls select{padding:9px 12px;font-size:15px}
.group-info{font-size:13px;color:#697480;margin:4px 12px 12px}
.match{background:white;margin:12px auto;padding:18px;width:min(780px,calc(100% - 28px));border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:82px;flex-wrap:wrap;box-shadow:0 3px 14px rgba(7,28,52,.10);border-top:3px solid rgba(0,168,232,.18)}
.match select,.match input{padding:9px;font-size:14px}.match select{min-width:165px}.match input{width:58px;text-align:center;font-size:18px;font-weight:bold}
.flag{width:46px;height:32px;object-fit:cover;display:block;flex-shrink:0;background:#fff;border:1px solid #d9e0e7;border-radius:5px;box-shadow:0 1px 4px rgba(7,28,52,.10)}
.score-separator{font-size:20px;font-weight:bold}
button{padding:8px 13px;border:none;background:var(--nl-blue);color:white;border-radius:7px;cursor:pointer;font-size:14px}
button:hover{background:#062c54}button.delete{background:#d8324a}button.delete:hover{background:#b5263b}.add-button{margin:5px 0 14px;font-size:15px}
h2{margin-top:25px}.table-wrapper{overflow-x:auto;padding:0 10px 30px}
table{margin:12px auto;border-collapse:collapse;width:min(820px,100%);background:white;box-shadow:0 3px 14px rgba(7,28,52,.10);border-radius:12px;overflow:hidden}
th,td{padding:9px 8px;border-bottom:1px solid #e8edf2}th{background:var(--nl-navy);color:white}td:first-child,th:first-child{width:46px;text-align:center}
td.team-cell{text-align:left;min-width:210px;font-weight:600}.table-flag{width:30px;height:21px;object-fit:cover;vertical-align:middle;margin-right:8px;background:#fff;border:1px solid #d9e0e7;border-radius:3px}
.legend{width:min(820px,calc(100% - 30px));margin:0 auto 10px;font-size:13px;color:#5f6670;text-align:left}.empty{margin:25px auto;color:#6e7780}
tr.qualify{background:#e8fbff}tr.playoff{background:#fff8dc}tr.relegation{background:#fde9ec}tr.promotion{background:#eefbe9}
@media(max-width:650px){.match{gap:7px;padding:14px 8px}.match select{min-width:125px;max-width:155px}.flag{width:40px;height:28px}th,td{padding:8px 5px;font-size:13px}td.team-cell{min-width:175px}}
</style>
</head>
<body>
<h1>
<img class="league-logo" id="leagueLogo" alt="Nations League">
<span>UEFA Nations League Manager 2026/27</span>
</h1>
<p class="subtitle">Dein eigener Ergebnis- und Tabellenrechner</p>
<div class="controls">
<label for="groupSelect">Gruppe:</label><select id="groupSelect" onchange="changeGroup()"></select>
<label for="matchday">Spieltag:</label><select id="matchday" onchange="changeMatchday()"></select>
</div>
<div class="group-info" id="groupInfo"></div>
<div id="matches"></div>
<button class="add-button" onclick="addMatch()">➕ Spiel hinzufügen</button>
<h2>📊 Tabelle</h2>
<div class="legend" id="legend"></div>
<div class="table-wrapper"><table>
<thead><tr><th>Pl.</th><th>Team</th><th>Sp.</th><th>Pkt.</th><th>Tore</th><th>Diff.</th></tr></thead>
<tbody id="table"></tbody>
</table></div>
<script>
const STORAGE_KEY="nations-league-manager-2026-27";
const GROUP_KEY="nations-league-current-group-2026-27";
const DAY_KEY="nations-league-current-matchday-2026-27";
const groups={"A1": ["Frankreich", "Italien", "Belgien", "Türkei"], "A2": ["Deutschland", "Niederlande", "Serbien", "Griechenland"], "A3": ["Spanien", "Kroatien", "England", "Tschechien"], "A4": ["Portugal", "Dänemark", "Norwegen", "Wales"], "B1": ["Schottland", "Schweiz", "Slowenien", "Nordmazedonien"], "B2": ["Ungarn", "Ukraine", "Georgien", "Nordirland"], "B3": ["Israel", "Österreich", "Irland", "Kosovo"], "B4": ["Polen", "Bosnien und Herzegowina", "Rumänien", "Schweden"], "C1": ["Albanien", "Finnland", "Belarus", "San Marino"], "C2": ["Montenegro", "Armenien", "Zypern", "Lettland"], "C3": ["Kasachstan", "Slowakei", "Färöer", "Moldau"], "C4": ["Island", "Bulgarien", "Estland", "Luxemburg"], "D1": ["Gibraltar", "Malta", "Andorra"], "D2": ["Litauen", "Aserbaidschan", "Liechtenstein"]};
const flagCodes={"Frankreich":"fr","Italien":"it","Belgien":"be","Türkei":"tr","Deutschland":"de","Niederlande":"nl","Serbien":"rs","Griechenland":"gr","Spanien":"es","Kroatien":"hr","England":"gb-eng","Tschechien":"cz","Portugal":"pt","Dänemark":"dk","Norwegen":"no","Wales":"gb-wls","Schottland":"gb-sct","Schweiz":"ch","Slowenien":"si","Nordmazedonien":"mk","Ungarn":"hu","Ukraine":"ua","Georgien":"ge","Nordirland":"gb-nir","Israel":"il","Österreich":"at","Irland":"ie","Kosovo":"xk","Polen":"pl","Bosnien und Herzegowina":"ba","Rumänien":"ro","Schweden":"se","Albanien":"al","Finnland":"fi","Belarus":"by","San Marino":"sm","Montenegro":"me","Armenien":"am","Zypern":"cy","Lettland":"lv","Kasachstan":"kz","Slowakei":"sk","Färöer":"fo","Moldau":"md","Island":"is","Bulgarien":"bg","Estland":"ee","Luxemburg":"lu","Gibraltar":"gi","Malta":"mt","Andorra":"ad","Litauen":"lt","Aserbaidschan":"az","Liechtenstein":"li"};

function leagueLogo(){
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
 <rect width="160" height="160" rx="22" fill="#071c34"/>
 <path d="M24 28C51 16 67 34 87 23c20-11 31 7 50-1v100c-21 9-35-8-54 2-22 11-37-8-59 2z" fill="#fff"/>
 <path d="M31 38l24-12 17 22 20-19 17 22 23-19 13 18-17 20 17 20-22 18-20-20-21 23-19-23-22 20-17-18 19-20z" fill="#00a8e8"/>
 <circle cx="54" cy="48" r="8" fill="#f5c542"/><circle cx="90" cy="55" r="8" fill="#df3348"/><circle cx="121" cy="50" r="8" fill="#b9e800"/>
 <circle cx="70" cy="88" r="8" fill="#b9e800"/><circle cx="104" cy="91" r="8" fill="#f5c542"/>
 <text x="80" y="145" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#fff">NATIONS LEAGUE</text></svg>`;
 return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}
document.getElementById("leagueLogo").src=leagueLogo();

function currentGroup(){return document.getElementById("groupSelect").value}
function currentDay(){return document.getElementById("matchday").value}
const allTeams=[...new Set(Object.values(groups).flat())];
function groupTeams(){return groups[currentGroup()]||[]}
function teams(){return allTeams}
function loadData(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}")}catch{return {}}}
function saveData(data){localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}
function groupData(data,g){if(!data[g])data[g]={};return data[g]}
function teamOptions(selected){return teams().map(t=>`<option value="${t}" ${t===selected?"selected":""}>${t}</option>`).join("")}
function flagUrl(name){
 const code=flagCodes[name];
 return code ? `https://flagcdn.com/w80/${code}.png` : "";
}
function flagImg(name, cls="flag"){
 const url=flagUrl(name);
 return `<img class="${cls}" src="${url}" alt="Flagge ${name}" title="${name}" loading="lazy">`;
}

function initControls(){
 const gs=document.getElementById("groupSelect");
 Object.keys(groups).forEach(g=>gs.add(new Option(`Liga ${g[0]} · Gruppe ${g}`,g)));
 gs.value=localStorage.getItem(GROUP_KEY)||"A2";
 const ds=document.getElementById("matchday");
 for(let i=1;i<=6;i++)ds.add(new Option(`Spieltag ${i}`,i));
 ds.value=localStorage.getItem(DAY_KEY)||"1";
}
function changeGroup(){localStorage.setItem(GROUP_KEY,currentGroup());renderAll()}
function changeMatchday(){localStorage.setItem(DAY_KEY,currentDay());renderMatches();renderTable()}
function renderInfo(){document.getElementById("groupInfo").textContent=groupTeams().join(" · ")}
function renderMatches(){
 const data=loadData(),g=currentGroup(),day=currentDay(),matches=(data[g]&&data[g][day])||[];
 if(!matches.length){document.getElementById("matches").innerHTML=`<div class="empty">Noch keine Spiele für Spieltag ${day} eingetragen.</div>`;return}
 let out="";
 matches.forEach((m,i)=>out+=`<div class="match">
 <span id="flag1-${i}">${flagImg(m.team1)}</span>
 <select id="team1-${i}">${teamOptions(m.team1)}</select>
 <input type="number" min="0" max="99" id="t1-${i}" value="${m.t1??""}" aria-label="Tore Heimteam">
 <span class="score-separator">:</span>
 <input type="number" min="0" max="99" id="t2-${i}" value="${m.t2??""}" aria-label="Tore Auswärtsteam">
 <select id="team2-${i}">${teamOptions(m.team2)}</select>
 <span id="flag2-${i}">${flagImg(m.team2)}</span>
 <button onclick="save(${i})">💾 Speichern</button><button class="delete" onclick="removeMatch(${i})">❌</button></div>`);
 document.getElementById("matches").innerHTML=out;
 document.querySelectorAll(".match select,.match input").forEach(el=>{
   el.addEventListener("change",saveAuto);
   el.addEventListener("input",()=>{if(el.tagName==="INPUT")saveAuto()});
 });
}
function saveAuto(){
 const data=loadData(),g=currentGroup(),day=currentDay(),gd=groupData(data,g),matches=gd[day]||[];
 document.querySelectorAll(".match").forEach((el,i)=>{
  if(!matches[i])return;
  matches[i].team1=document.getElementById(`team1-${i}`).value;
  matches[i].team2=document.getElementById(`team2-${i}`).value;
  matches[i].t1=document.getElementById(`t1-${i}`).value;
  matches[i].t2=document.getElementById(`t2-${i}`).value;
  document.getElementById(`flag1-${i}`).innerHTML=flagImg(matches[i].team1);
  document.getElementById(`flag2-${i}`).innerHTML=flagImg(matches[i].team2);
 });
 gd[day]=matches;saveData(data);renderTable();
}
function addMatch(){
 const data=loadData(),g=currentGroup(),day=currentDay(),gd=groupData(data,g);
 if(!gd[day])gd[day]=[];
 const used=new Set();gd[day].forEach(m=>{used.add(m.team1);used.add(m.team2)});
 const preferred=groupTeams().filter(t=>!used.has(t));
 const free=allTeams.filter(t=>!used.has(t));
 gd[day].push({team1:preferred[0]||free[0]||allTeams[0],team2:preferred[1]||free[1]||allTeams[1],t1:"",t2:""});
 saveData(data);renderMatches();
}
function removeMatch(i){
 const data=loadData(),g=currentGroup(),day=currentDay();
 if(!data[g]||!data[g][day])return;
 data[g][day].splice(i,1);saveData(data);renderMatches();renderTable();
}
function save(){saveAuto()}
function rowClass(i,league){
 if(league==="A")return i<2?"qualify":i===2?"playoff":"relegation";
 if(league==="B")return i===0?"promotion":i===1||i===2?"playoff":"relegation";
 if(league==="C")return i===0?"promotion":i===1?"playoff":i===3?"relegation":"";
 return i===0?"promotion":i===1?"playoff":"";
}
function renderLegend(){
 const l=currentGroup()[0],txt={
 A:"🔵 Platz 1–2: Viertelfinale · 🟡 Platz 3: Play-off · 🔴 Platz 4: Abstieg",
 B:"🟢 Platz 1: Aufstieg · 🟡 Platz 2/3: Play-offs · 🔴 Platz 4: Abstieg",
 C:"🟢 Platz 1: Aufstieg · 🟡 Platz 2: Play-off · 🔴 Platz 4: Abstieg",
 D:"🟢 Platz 1: Aufstieg · 🟡 Platz 2: Play-off"
 };document.getElementById("legend").textContent=txt[l];
}
function renderTable(){
 const data=loadData(),g=currentGroup(),table={};
 const gd=data[g]||{};
 // Start with the original countries of the selected group.
 groupTeams().forEach(t=>table[t]={played:0,points:0,goalsFor:0,goalsAgainst:0});
 // Also add every country that has been selected in any match of this group.
 Object.values(gd).forEach(day=>{
  if(!Array.isArray(day))return;
  day.forEach(m=>{
   [m.team1,m.team2].forEach(t=>{
    if(t && !table[t]) table[t]={played:0,points:0,goalsFor:0,goalsAgainst:0};
   });
  });
 });
 Object.values(gd).forEach(day=>{if(!Array.isArray(day))return;day.forEach(m=>{
  if(m.t1===""||m.t2===""||!table[m.team1]||!table[m.team2]||m.team1===m.team2)return;
  const a=parseInt(m.t1,10),b=parseInt(m.t2,10);if(Number.isNaN(a)||Number.isNaN(b)||a<0||b<0)return;
  table[m.team1].played++;table[m.team2].played++;table[m.team1].goalsFor+=a;table[m.team1].goalsAgainst+=b;table[m.team2].goalsFor+=b;table[m.team2].goalsAgainst+=a;
  if(a>b)table[m.team1].points+=3;else if(b>a)table[m.team2].points+=3;else{table[m.team1].points++;table[m.team2].points++}
 })});
 const sorted=Object.entries(table).sort((a,b)=>b[1].points-a[1].points||((b[1].goalsFor-b[1].goalsAgainst)-(a[1].goalsFor-a[1].goalsAgainst))||b[1].goalsFor-a[1].goalsFor||a[0].localeCompare(b[0],"de"));
 document.getElementById("table").innerHTML=sorted.map(([t,v],i)=>{const d=v.goalsFor-v.goalsAgainst;return `<tr class="${rowClass(i,g[0])}"><td>${i+1}</td><td class="team-cell">${flagImg(t,"table-flag")}${t}</td><td>${v.played}</td><td><strong>${v.points}</strong></td><td>${v.goalsFor}:${v.goalsAgainst}</td><td>${d>0?"+":""}${d}</td></tr>`}).join("");
}
function renderAll(){renderInfo();renderMatches();renderLegend();renderTable()}
initControls();renderAll();
</script>
</body></html>
